# Local development and test infrastructure only. Credentials below are local-only
# placeholders read from .env (see .env.example); never reuse them anywhere else.
name: emi-copilot

services:
  postgres:
    image: docker.io/library/postgres:16.14-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emi_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emi_copilot_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-emi_copilot}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Healthy only once the final server accepts TCP and the test database exists,
      # not while the entrypoint's temporary init server is running.
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql --host=127.0.0.1
          --username="$${POSTGRES_USER}" --dbname=emi_copilot_test
          --no-align --tuples-only --command="SELECT 1" > /dev/null
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
