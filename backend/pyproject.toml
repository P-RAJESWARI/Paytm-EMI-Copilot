[project]
name = "emi-copilot"
version = "0.1.0"
description = "EMI-at-Counter Copilot backend: EMI maths, payment gateway handoff and merchant reports."
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.1",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-ulid==4.1.0",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# LangGraph runs the AI flows only (CLAUDE.md D5, plan step 4.5); the core never needs it.
ai = ["langgraph==1.2.19"]

[dependency-groups]
dev = [
    "coverage==7.17.0",
    "detect-secrets==1.5.0",
    "hypothesis==6.170.14",
    "mypy==2.4.1",
    "openapi-spec-validator==0.9.0",
    "paytmchecksum==1.7.0",
    "pre-commit==4.7.0",
    "pycryptodome==4.2.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv]
# security-and-compliance.md section 5: a newly added package version must be at least two weeks
# old. The ai extra's transitive packages are held to versions uploaded by 1 Nov 2026; packages
# locked before Layer 4 are not affected.
# Every langsmith from 0.12 on needs httpx2, which Starlette's TestClient then prefers over the
# pinned httpx (ADR 0008), changing the backend of every API test. langsmith 0.11 still uses
# httpx, and langchain-core up to 1.6.12 accepts it.
constraint-dependencies = ["langsmith<0.12"]
exclude-newer-package = { jsonpatch = "2026-11-02T00:00:00Z", jsonpointer = "2026-11-02T00:00:00Z", langchain-core = "2026-11-02T00:00:00Z", langchain-protocol = "2026-11-02T00:00:00Z", langgraph-checkpoint = "2026-11-02T00:00:00Z", langgraph-prebuilt = "2026-11-02T00:00:00Z", langgraph-sdk = "2026-11-02T00:00:00Z", langsmith = "2026-11-02T00:00:00Z", ormsgpack = "2026-11-02T00:00:00Z", xxhash = "2026-11-02T00:00:00Z" }

[tool.uv.build-backend]
module-name = "emi_copilot"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins: no shadowed builtins
    "ANN",   # flake8-annotations: every signature typed
    "ARG",   # unused arguments
    "B",     # flake8-bugbear: likely bugs and design problems
    "BLE",   # no blind `except Exception`
    "C4",    # comprehension hygiene
    "C90",   # mccabe complexity
    "D",     # pydocstyle: every module, class and function has a docstring
    "DTZ",   # no naive datetimes
    "E",     # pycodestyle errors
    "ERA",   # no commented-out code
    "F",     # pyflakes
    "FIX",   # no TODO/FIXME left behind
    "I",     # isort
    "N",     # pep8-naming
    "PL",    # pylint
    "PT",    # pytest style
    "PTH",   # pathlib over os.path
    "RET",   # return hygiene
    "RUF",   # ruff-specific
    "S",     # flake8-bandit security checks
    "SIM",   # simplifications
    "TID251", # banned imports: no LangChain anywhere, LangGraph only in its flow runner
    "T20",   # no print statements
    "TRY",   # exception hygiene
    "UP",    # modern Python syntax
    "W",     # pycodestyle warnings
]
ignore = [
    "D104",   # empty package __init__.py files carry no docstring
    "TRY003", # typed errors may take a descriptive message
]

[tool.ruff.lint.per-file-ignores]
# The one module allowed to import langgraph, and the test that spies on its compiled graph.
"src/emi_copilot/adapters/ai/flows/langgraph_flow_runner.py" = ["TID251"]
"tests/unit/adapters/ai/flows/test_langgraph_flow_runner.py" = ["TID251"]
"tests/**/*.py" = [
    "PLR2004", # literal expected values read best inline in tests
    "S101",    # pytest uses bare assert
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Owner rule (CLAUDE.md D5, ADR 0025): LangGraph runs the AI flows only, and LangChain is never
# imported; langchain-core arrives only as a transitive dependency of langgraph.
"langchain".msg = "LangChain is not used in this project (owner rule, ADR 0025)."
"langchain_core".msg = "LangChain is not used in this project (owner rule, ADR 0025)."
"langchain_community".msg = "LangChain is not used in this project (owner rule, ADR 0025)."
"langgraph".msg = "Only adapters/ai/flows/langgraph_flow_runner.py may import langgraph (ADR 0025)."

[tool.ruff.lint.isort]
# scripts/ is a package so tests can import the seed helpers; it is our code, not a library.
known-first-party = ["emi_copilot", "scripts", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "scripts"]

# The official paytmchecksum library is untyped; only the tests import it (ADR 0003).
[[tool.mypy.overrides]]
module = ["paytmchecksum", "paytmchecksum.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
# langsmith (a transitive dependency of the ai extra) registers a pytest plugin; it is not used.
addopts = ["--strict-markers", "--strict-config", "-ra", "-p", "no:langsmith_plugin"]
markers = ["integration: needs the Docker Compose PostgreSQL test database"]
xfail_strict = true
filterwarnings = [
    "error",
    # Starlette 1.10 prefers httpx2 for its TestClient; httpx is the pinned HTTP client (ADR 0008).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.coverage.run]
source = ["emi_copilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
