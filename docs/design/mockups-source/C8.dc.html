<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C8 Teach-back</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Tamil:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:360px;height:800px;display:flex;flex-direction:column;background:#EEF6FB;font-family:Inter,'Noto Sans Tamil',system-ui,sans-serif;color:#0B1F3A;overflow:hidden">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#FFFFFF;border-bottom:1px solid #DCE7F0;flex-shrink:0">
    <a href="C7.dc.html" aria-label="{{t.back}}" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#002E6E"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="font-size:14px;color:#5B6B82;font-weight:600">{{t.optional}}</div>
    <div role="group" aria-label="Language" style="display:flex;background:#EEF6FB;border-radius:999px;padding:3px">
      <button onClick="{{setEn}}" aria-pressed="{{isEn}}" style="min-width:48px;height:42px;border:0;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;background:{{enBg}};color:{{enFg}}">EN</button>
      <button onClick="{{setTa}}" aria-pressed="{{isTa}}" style="min-width:60px;height:42px;border:0;border-radius:999px;font-family:'Noto Sans Tamil',sans-serif;font-size:14px;font-weight:600;background:{{taBg}};color:{{taFg}}">தமிழ்</button>
    </div>
  </header>

  <main style="flex:1;min-height:0;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <h1 style="margin:0;font-size:22px;line-height:1.35;color:#002E6E">{{t.title}}</h1>
      <p style="margin:0;font-size:15px;line-height:1.5;color:#5B6B82">{{t.sub}}</p>
    </div>

    <div style="background:#FFFFFF;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.45"><span style="color:#5B6B82">{{t.chosen}}</span> <strong>{{t.plan}}</strong></div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="tb" style="font-size:15px;font-weight:600">{{t.label}}</label>
      <textarea id="tb" rows="3" value="{{answer}}" onChange="{{onType}}" placeholder="{{t.ph}}" style="box-sizing:border-box;width:100%;border-radius:14px;border:2px solid #DCE7F0;background:#FFFFFF;padding:12px 14px;font-family:inherit;font-size:17px;line-height:1.5;color:#0B1F3A;resize:none"></textarea>
    </div>

    <div style="display:flex;align-items:center;gap:14px">
      <button onClick="{{onMic}}" aria-label="{{t.mic}}" style="width:64px;height:64px;border-radius:999px;border:0;background:#F5A524;color:#0B1F3A;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
      </button>
      <div style="font-size:15px;line-height:1.45">{{t.mic}}</div>
    </div>

    <sc-if value="{{isAgain}}" hint-placeholder-val="{{ false }}">
      <div style="background:#FFFFFF;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(11,31,58,0.06),0 6px 16px rgba(11,31,58,0.06)">
        <div style="font-size:17px;font-weight:700">{{t.closeTitle}}</div>
        <div style="font-size:16px;line-height:1.55">{{t.closeBody}}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span style="display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:10px;background:#EEF6FB;color:#002E6E;font-size:15px;font-weight:700">₹3,667 × 6</span>
          <span style="display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:10px;background:#E3F7F0;color:#0A6E50;font-size:15px;font-weight:700">{{t.extra0}}</span>
        </div>
        <a href="C7.dc.html" style="display:inline-flex;align-items:center;min-height:44px;font-size:16px;font-weight:700;color:#002E6E">{{t.again}}</a>
      </div>
    </sc-if>
  </main>

  <div style="padding:12px 16px 20px;background:#FFFFFF;border-top:1px solid #DCE7F0;flex-shrink:0;display:flex;flex-direction:column;gap:4px">
    <a href="C9.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:14px;background:#00BAF2;color:#002E6E;font-weight:700;font-size:18px;text-decoration:none">{{t.cta}}</a>
    <a href="C9.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:44px;color:#002E6E;font-weight:600;font-size:15px;text-decoration:none">{{t.skip}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","ta"],"default":"en"},"screenState":{"editor":"enum","options":["default","again"],"default":"default"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const lang = st.lang || this.props.lang || 'en';
    const s = st.s || this.props.screenState || 'default';
    const en = lang === 'en';
    const S = {
      en: {
        back: 'Back', optional: 'Optional check',
        title: 'Tell us in your own words what you will pay each month.',
        sub: 'This is not a test. It helps make sure the plan is clear.',
        chosen: 'Plan you are looking at:', plan: 'No-cost EMI, 6 months',
        label: 'Your answer', ph: 'For example: I pay … every month for … months',
        mic: 'Or tap and say it',
        closeTitle: 'Nearly there',
        closeBody: 'You will pay ₹3,667 every month for 6 months. Nothing extra on top of ₹22,000.',
        extra0: 'Extra ₹0', again: 'Explain it again',
        heard: 'About ₹3,000 every month',
        cta: 'Continue', skip: 'Skip this step'
      },
      ta: {
        back: 'பின்செல்', optional: 'விருப்பச் சரிபார்ப்பு',
        title: 'ஒவ்வொரு மாதமும் எவ்வளவு செலுத்துவீர்கள் என்று உங்கள் வார்த்தைகளில் சொல்லுங்கள்.',
        sub: 'இது தேர்வு அல்ல. திட்டம் தெளிவாக இருக்கிறதா என்று பார்க்க உதவும்.',
        chosen: 'நீங்கள் பார்க்கும் திட்டம்:', plan: 'கட்டணமில்லா EMI, 6 மாதங்கள்',
        label: 'உங்கள் பதில்', ph: 'உதாரணம்: மாதம் … , … மாதங்களுக்கு',
        mic: 'அல்லது தட்டிச் சொல்லுங்கள்',
        closeTitle: 'கிட்டத்தட்ட சரி',
        closeBody: 'நீங்கள் 6 மாதங்களுக்கு ஒவ்வொரு மாதமும் ₹3,667 செலுத்துவீர்கள். ₹22,000-க்கு மேல் கூடுதல் இல்லை.',
        extra0: 'கூடுதல் ₹0', again: 'மீண்டும் விளக்கவும்',
        heard: 'மாதம் சுமார் ₹3,000',
        cta: 'தொடர்க', skip: 'இந்தப் படியைத் தவிர்'
      }
    }[lang];
    const answer = st.answer !== undefined ? st.answer : (s === 'again' ? S.heard : '');
    return {
      t: S, isEn: en, isTa: !en, answer, isAgain: s === 'again',
      onType: (e) => this.setState({ answer: e.target.value }),
      onMic: () => this.setState({ s: 'again', answer: undefined }),
      enBg: en ? '#002E6E' : 'transparent', enFg: en ? '#FFFFFF' : '#002E6E',
      taBg: !en ? '#002E6E' : 'transparent', taFg: !en ? '#FFFFFF' : '#002E6E',
      setEn: () => this.setState({ lang: 'en' }),
      setTa: () => this.setState({ lang: 'ta' })
    };
  }
}
</script>
</body>
</html>
