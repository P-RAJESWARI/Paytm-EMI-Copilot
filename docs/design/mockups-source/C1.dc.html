<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C1 Welcome and language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Tamil:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:360px;height:800px;display:flex;flex-direction:column;background:#EEF6FB;font-family:Inter,'Noto Sans Tamil',system-ui,sans-serif;color:#0B1F3A;overflow:hidden">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#FFFFFF;border-bottom:1px solid #DCE7F0;flex-shrink:0">
    <div style="display:flex;align-items:center;gap:8px;font-weight:700;color:#002E6E;font-size:16px;padding-left:4px">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#002E6E"></rect><path d="M7.5 19c1.8-6.5 11.2-6.5 13 0" stroke="#00BAF2" stroke-width="3" fill="none" stroke-linecap="round"></path><circle cx="14" cy="10.5" r="2.6" fill="#00BAF2"></circle></svg>
      EMI Copilot
    </div>
    <div role="group" aria-label="Language" style="display:flex;background:#EEF6FB;border-radius:999px;padding:3px">
      <button onClick="{{setEn}}" aria-pressed="{{isEn}}" style="min-width:48px;height:42px;border:0;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;background:{{enBg}};color:{{enFg}}">EN</button>
      <button onClick="{{setTa}}" aria-pressed="{{isTa}}" style="min-width:60px;height:42px;border:0;border-radius:999px;font-family:'Noto Sans Tamil',sans-serif;font-size:14px;font-weight:600;background:{{taBg}};color:{{taFg}}">தமிழ்</button>
    </div>
  </header>

  <main style="flex:1;min-height:0;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column;gap:20px">
    <div style="background:#FFFFFF;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 2px rgba(11,31,58,0.06),0 6px 16px rgba(11,31,58,0.06)">
      <div style="width:52px;height:52px;border-radius:12px;background:#EEF6FB;display:flex;align-items:center;justify-content:center;color:#002E6E;flex-shrink:0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect><path d="M10.5 18.5h3"></path></svg></div>
      <div style="flex:1">
        <div style="font-size:14px;color:#5B6B82">{{t.at}}</div>
        <div style="font-weight:700;font-size:16px">{{t.product}}</div>
      </div>
      <div style="font-weight:700;font-size:20px;color:#002E6E">₹22,000</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <h1 style="margin:0;font-size:26px;line-height:1.25;color:#002E6E">{{t.title}}</h1>
      <p style="margin:0;font-size:16px;line-height:1.55;color:#5B6B82">{{t.sub}}</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="font-size:15px;font-weight:600">{{t.choose}}</div>
      <button onClick="{{setTa}}" aria-pressed="{{isTa}}" style="display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 18px;border-radius:14px;background:#FFFFFF;border:2px solid {{taBorder}};font-family:'Noto Sans Tamil',sans-serif;font-size:20px;font-weight:600;color:#0B1F3A;text-align:left">தமிழ்<span style="width:24px;height:24px;border-radius:999px;box-sizing:border-box;border:{{taRadio}}"></span></button>
      <button onClick="{{setEn}}" aria-pressed="{{isEn}}" style="display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 18px;border-radius:14px;background:#FFFFFF;border:2px solid {{enBorder}};font-family:inherit;font-size:20px;font-weight:600;color:#0B1F3A;text-align:left">English<span style="width:24px;height:24px;border-radius:999px;box-sizing:border-box;border:{{enRadio}}"></span></button>
    </div>

    <div style="display:flex;gap:10px;align-items:flex-start;background:#FFFFFF;border-radius:14px;padding:14px;font-size:15px;line-height:1.5;color:#0B1F3A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#002E6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
      <span>{{t.data}}</span>
    </div>
  </main>

  <div style="padding:12px 16px 20px;background:#FFFFFF;border-top:1px solid #DCE7F0;flex-shrink:0">
    <a href="C2.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:14px;background:#00BAF2;color:#002E6E;font-weight:700;font-size:18px;text-decoration:none">{{t.start}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","ta"],"default":"en"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const lang = st.lang || this.props.lang || 'en';
    const S = {
      en: {
        at: 'At Ravi Electronics',
        product: 'Example phone, 128 GB',
        title: 'Pay in EMIs, with every cost shown',
        sub: 'See each plan’s monthly amount and the extra you pay in total. You choose; nothing is decided for you.',
        choose: 'Choose your language',
        data: 'We use the price and the monthly amount you tell us. If you allow it, we also check your monthly inflow and EMIs. The shop cannot see these.',
        start: 'Start'
      },
      ta: {
        at: 'ரவி எலக்ட்ரானிக்ஸ்',
        product: 'Example phone, 128 GB',
        title: 'எல்லா செலவும் தெரிந்து EMI-யில் வாங்குங்கள்',
        sub: 'ஒவ்வொரு திட்டத்தின் மாதத் தொகையும், மொத்தக் கூடுதல் செலவும் காட்டப்படும். முடிவு உங்களுடையது.',
        choose: 'மொழியைத் தேர்ந்தெடுக்கவும்',
        data: 'விலையையும் நீங்கள் சொல்லும் மாதத் தொகையையும் பயன்படுத்துகிறோம். நீங்கள் அனுமதித்தால், உங்கள் மாத வரவு மற்றும் EMI-களையும் பார்ப்போம். இதைக் கடை பார்க்க முடியாது.',
        start: 'தொடங்கு'
      }
    }[lang];
    const en = lang === 'en';
    const radioOn = '7px solid #00BAF2', radioOff = '2px solid #C9D8E6';
    return {
      t: S, isEn: en, isTa: !en,
      enBg: en ? '#002E6E' : 'transparent', enFg: en ? '#FFFFFF' : '#002E6E',
      taBg: !en ? '#002E6E' : 'transparent', taFg: !en ? '#FFFFFF' : '#002E6E',
      enBorder: en ? '#00BAF2' : '#DCE7F0', taBorder: !en ? '#00BAF2' : '#DCE7F0',
      enRadio: en ? radioOn : radioOff, taRadio: !en ? radioOn : radioOff,
      setEn: () => this.setState({ lang: 'en' }),
      setTa: () => this.setState({ lang: 'ta' })
    };
  }
}
</script>
</body>
</html>
