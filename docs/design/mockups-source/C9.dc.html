<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C9 Consent and OTP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Tamil:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:360px;height:800px;display:flex;flex-direction:column;background:#EEF6FB;font-family:Inter,'Noto Sans Tamil',system-ui,sans-serif;color:#0B1F3A;overflow:hidden">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#FFFFFF;border-bottom:1px solid #DCE7F0;flex-shrink:0">
    <a href="C7.dc.html" aria-label="{{t.back}}" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#002E6E"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="font-size:14px;color:#5B6B82;font-weight:600">{{t.step}}</div>
    <div role="group" aria-label="Language" style="display:flex;background:#EEF6FB;border-radius:999px;padding:3px">
      <button onClick="{{setEn}}" aria-pressed="{{isEn}}" style="min-width:48px;height:42px;border:0;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;background:{{enBg}};color:{{enFg}}">EN</button>
      <button onClick="{{setTa}}" aria-pressed="{{isTa}}" style="min-width:60px;height:42px;border:0;border-radius:999px;font-family:'Noto Sans Tamil',sans-serif;font-size:14px;font-weight:600;background:{{taBg}};color:{{taFg}}">தமிழ்</button>
    </div>
  </header>

  <main style="flex:1;min-height:0;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px">
    <h1 style="margin:0;font-size:22px;line-height:1.3;color:#002E6E">{{t.title}}</h1>

    <div style="background:#FFFFFF;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(11,31,58,0.06),0 6px 16px rgba(11,31,58,0.06)">
      <div style="font-weight:700;font-size:17px">{{t.plan}}</div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
        <div style="background:#EEF6FB;border-radius:12px;padding:8px 12px"><div style="font-size:14px;color:#5B6B82;font-weight:600">{{t.monthly}}</div><div style="font-size:22px;font-weight:700;color:#002E6E">₹3,667</div></div>
        <div style="background:#E3F7F0;border-radius:12px;padding:8px 12px"><div style="font-size:14px;color:#0A6E50;font-weight:600">{{t.extra}}</div><div style="font-size:22px;font-weight:700;color:#0A6E50">₹0</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:15px"><span style="color:#5B6B82">{{t.tenure}}</span><strong>{{t.months}}</strong></div>
      <div style="display:flex;justify-content:space-between;font-size:15px"><span style="color:#5B6B82">{{t.total}}</span><strong>₹22,000</strong></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="otp1" style="font-size:15px;font-weight:600">{{t.otpLabel}}</label>
      <div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px">
        <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
          <input id="{{d.id}}" inputmode="numeric" maxlength="1" value="{{d.v}}" readOnly="{{ true }}" aria-label="{{d.aria}}" style="box-sizing:border-box;width:100%;height:56px;border-radius:12px;border:2px solid {{otpBorder}};background:#FFFFFF;text-align:center;font-family:inherit;font-size:24px;font-weight:700;color:#002E6E">
        </sc-for>
      </div>
      <sc-if value="{{isDefault}}" hint-placeholder-val="{{ true }}">
        <div style="font-size:14px;color:#5B6B82">{{t.resendIn}}</div>
      </sc-if>
      <sc-if value="{{isWrong}}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.45;color:#B4232A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex-shrink:0;margin-top:2px" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5"></path><path d="M12 16v.5"></path></svg>{{t.wrong}}</div>
      </sc-if>
      <sc-if value="{{isExpired}}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="font-size:15px;line-height:1.45;color:#0B1F3A">{{t.expired}}</div>
          <button style="align-self:flex-start;height:48px;padding:0 16px;border-radius:12px;border:2px solid #002E6E;background:#FFFFFF;color:#002E6E;font-family:inherit;font-size:15px;font-weight:700">{{t.resend}}</button>
        </div>
      </sc-if>
    </div>

    <div style="display:flex;gap:10px;align-items:flex-start;background:#FFFFFF;border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.5">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#002E6E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M9 2h6"></path></svg>
      <span>{{t.cooling}}</span>
    </div>
    <div style="font-size:14px;line-height:1.5;color:#5B6B82">{{t.agree}}</div>
  </main>

  <div style="padding:12px 16px 20px;background:#FFFFFF;border-top:1px solid #DCE7F0;flex-shrink:0">
    <a href="C10.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:14px;background:#00BAF2;color:#002E6E;font-weight:700;font-size:18px;text-decoration:none">{{t.cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","ta"],"default":"en"},"screenState":{"editor":"enum","options":["default","wrong","expired"],"default":"default"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const lang = st.lang || this.props.lang || 'en';
    const s = this.props.screenState || 'default';
    const en = lang === 'en';
    const S = {
      en: {
        back: 'Back', step: 'Confirm', title: 'Check and confirm your plan',
        plan: 'No-cost EMI', monthly: 'Each month', extra: 'Extra in total',
        tenure: 'Tenure', months: '6 months', total: 'Total you pay',
        otpLabel: 'Enter the 6-digit OTP sent to your phone ending 42',
        resendIn: 'You can ask for a new OTP in 0:24',
        wrong: 'That OTP does not match. Check the message and try again. 2 tries left.',
        expired: 'This OTP has expired. Ask for a new one.',
        resend: 'Send a new OTP',
        cooling: 'You can cancel within the cooling-off period.',
        agree: 'By confirming, you agree to this plan. You will pay on Paytm next. We never ask for card details here.',
        cta: 'Confirm'
      },
      ta: {
        back: 'பின்செல்', step: 'உறுதிசெய்', title: 'உங்கள் திட்டத்தைச் சரிபார்த்து உறுதிசெய்யுங்கள்',
        plan: 'கட்டணமில்லா EMI', monthly: 'ஒவ்வொரு மாதமும்', extra: 'மொத்தக் கூடுதல்',
        tenure: 'காலம்', months: '6 மாதங்கள்', total: 'மொத்தம் நீங்கள் செலுத்துவது',
        otpLabel: '42-ல் முடியும் உங்கள் போனுக்கு வந்த 6 இலக்க OTP-ஐ உள்ளிடவும்',
        resendIn: '0:24-க்குப் பிறகு புதிய OTP கேட்கலாம்',
        wrong: 'இந்த OTP பொருந்தவில்லை. செய்தியைப் பார்த்து மீண்டும் முயற்சிக்கவும். இன்னும் 2 முறை.',
        expired: 'இந்த OTP காலாவதியாகிவிட்டது. புதியதைக் கேளுங்கள்.',
        resend: 'புதிய OTP அனுப்பு',
        cooling: 'குறிப்பிட்ட காலத்திற்குள் இதை ரத்து செய்யலாம்.',
        agree: 'உறுதிசெய்வதன் மூலம் இந்தத் திட்டத்துக்கு ஒப்புக்கொள்கிறீர்கள். அடுத்து Paytm-ல் பணம் செலுத்துவீர்கள். இங்கே கார்டு விவரங்களை நாங்கள் கேட்பதில்லை.',
        cta: 'உறுதிசெய்'
      }
    }[lang];
    const vals = s === 'wrong' ? ['4', '8', '2', '1', '9', '3'] : (s === 'expired' ? ['5', '0', '7', '', '', ''] : ['', '', '', '', '', '']);
    const digits = vals.map((v, i) => ({ v, id: 'otp' + (i + 1), aria: 'Digit ' + (i + 1) }));
    return {
      t: S, isEn: en, isTa: !en, digits,
      isDefault: s === 'default', isWrong: s === 'wrong', isExpired: s === 'expired',
      otpBorder: s === 'wrong' ? '#E5484D' : '#DCE7F0',
      enBg: en ? '#002E6E' : 'transparent', enFg: en ? '#FFFFFF' : '#002E6E',
      taBg: !en ? '#002E6E' : 'transparent', taFg: !en ? '#FFFFFF' : '#002E6E',
      setEn: () => this.setState({ lang: 'en' }),
      setTa: () => this.setState({ lang: 'ta' })
    };
  }
}
</script>
</body>
</html>
