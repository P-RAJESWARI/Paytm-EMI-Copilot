<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Merchant screen states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Tamil:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:3248px;height:1868px;box-sizing:border-box;padding:48px;background:#DCE7F0;font-family:Inter,'Noto Sans Tamil',system-ui,sans-serif;color:#0B1F3A;display:flex;flex-direction:column;gap:32px">
  <h1 style="margin:0;font-size:32px;color:#002E6E">Merchant states</h1>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 40px">
    <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:16px;font-weight:700">M3 Show QR: not scanned yet</div><div style="width:1024px;height:768px;overflow:hidden;border-radius:12px"><dc-import name="M3" screen-state="waiting" hint-size="1024px,768px"></dc-import></div></div>
    <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:16px;font-weight:700">M3 Show QR: ready to pay</div><div style="width:1024px;height:768px;overflow:hidden;border-radius:12px"><dc-import name="M3" screen-state="ready" hint-size="1024px,768px"></dc-import></div></div>
    <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:16px;font-weight:700">M4 Status: paid</div><div style="width:1024px;height:768px;overflow:hidden;border-radius:12px"><dc-import name="M4" screen-state="paid" hint-size="1024px,768px"></dc-import></div></div>
    <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:16px;font-weight:700">M4 Status: failed</div><div style="width:1024px;height:768px;overflow:hidden;border-radius:12px"><dc-import name="M4" screen-state="failed" hint-size="1024px,768px"></dc-import></div></div>
    <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:16px;font-weight:700">M5 Sales report: empty</div><div style="width:1024px;height:768px;overflow:hidden;border-radius:12px"><dc-import name="M5" screen-state="empty" hint-size="1024px,768px"></dc-import></div></div>
    <div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:16px;font-weight:700">M5 Sales report: Tamil summary</div><div style="width:1024px;height:768px;overflow:hidden;border-radius:12px"><dc-import name="M5" lang="ta" hint-size="1024px,768px"></dc-import></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3248,"height":1868}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
