<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C3 Comfort check consent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Tamil:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:360px;height:800px;display:flex;flex-direction:column;background:#EEF6FB;font-family:Inter,'Noto Sans Tamil',system-ui,sans-serif;color:#0B1F3A;overflow:hidden">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#FFFFFF;border-bottom:1px solid #DCE7F0;flex-shrink:0">
    <a href="C2.dc.html" aria-label="{{t.back}}" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#002E6E"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="font-size:14px;color:#5B6B82;font-weight:600">{{t.step}}</div>
    <div role="group" aria-label="Language" style="display:flex;background:#EEF6FB;border-radius:999px;padding:3px">
      <button onClick="{{setEn}}" aria-pressed="{{isEn}}" style="min-width:48px;height:42px;border:0;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;background:{{enBg}};color:{{enFg}}">EN</button>
      <button onClick="{{setTa}}" aria-pressed="{{isTa}}" style="min-width:60px;height:42px;border:0;border-radius:999px;font-family:'Noto Sans Tamil',sans-serif;font-size:14px;font-weight:600;background:{{taBg}};color:{{taFg}}">தமிழ்</button>
    </div>
  </header>

  <main style="flex:1;min-height:0;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <h1 style="margin:0;font-size:24px;line-height:1.3;color:#002E6E">{{t.title}}</h1>
      <p style="margin:0;font-size:16px;line-height:1.5;color:#5B6B82">{{t.why}}</p>
    </div>

    <div style="background:#FFFFFF;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(11,31,58,0.06),0 6px 16px rgba(11,31,58,0.06)">
      <div style="font-weight:700;font-size:16px">{{t.read}}</div>
      <div style="display:flex;gap:12px;align-items:center;font-size:16px;line-height:1.4"><span style="width:40px;height:40px;border-radius:12px;background:#EEF6FB;display:flex;align-items:center;justify-content:center;color:#002E6E;flex-shrink:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg></span>{{t.i1}}</div>
      <div style="display:flex;gap:12px;align-items:center;font-size:16px;line-height:1.4"><span style="width:40px;height:40px;border-radius:12px;background:#EEF6FB;display:flex;align-items:center;justify-content:center;color:#002E6E;flex-shrink:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M4 10h16"></path></svg></span>{{t.i2}}</div>
      <div style="font-size:15px;line-height:1.5;color:#5B6B82">{{t.only}}</div>
    </div>

    <div style="display:flex;gap:10px;align-items:center;background:#FFFFFF;border-radius:14px;padding:14px;font-size:16px;color:#002E6E;font-weight:600;line-height:1.4">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><path d="M3 3l18 18"></path></svg>
      {{t.privacy}}
    </div>

    <div style="font-size:15px;line-height:1.5;color:#5B6B82">{{t.advice}}</div>
  </main>

  <div style="padding:12px 16px 20px;background:#FFFFFF;border-top:1px solid #DCE7F0;flex-shrink:0;display:flex;flex-direction:column;gap:8px">
    <a href="C4.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:14px;background:#00BAF2;color:#002E6E;font-weight:700;font-size:18px;text-decoration:none">{{t.allow}}</a>
    <a href="C4.dc.html" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;border-radius:14px;color:#002E6E;font-weight:600;font-size:16px;text-decoration:none;text-align:center">{{t.skip}}<span style="font-size:13px;font-weight:400;color:#5B6B82">{{t.skipNote}}</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","ta"],"default":"en"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const lang = st.lang || this.props.lang || 'en';
    const S = {
      en: {
        back: 'Back', step: 'Step 2 of 4',
        title: 'Check if a plan fits your month?',
        why: 'This shows how much of your monthly money each plan would take.',
        read: 'If you allow, we read only:',
        i1: 'Average money coming in each month',
        i2: 'EMIs you already pay',
        only: 'Used only for this check, for this purchase.',
        privacy: 'The shop cannot see this information.',
        advice: 'This is advice to help you choose. It is not a loan decision.',
        allow: 'Allow', skip: 'Skip', skipNote: 'You can still compare all plans'
      },
      ta: {
        back: 'பின்செல்', step: 'படி 2 / 4',
        title: 'திட்டம் உங்கள் மாதத்துக்குப் பொருந்துமா எனப் பார்க்கலாமா?',
        why: 'ஒவ்வொரு திட்டமும் உங்கள் மாதப் பணத்தில் எவ்வளவு எடுக்கும் என்று இது காட்டும்.',
        read: 'நீங்கள் அனுமதித்தால், இவற்றை மட்டும் பார்ப்போம்:',
        i1: 'ஒவ்வொரு மாதமும் வரும் சராசரி பணம்',
        i2: 'நீங்கள் ஏற்கனவே செலுத்தும் EMI-கள்',
        only: 'இந்த வாங்குதலுக்கான சோதனைக்கு மட்டுமே பயன்படும்.',
        privacy: 'இந்தத் தகவலை கடை பார்க்க முடியாது.',
        advice: 'இது தேர்வு செய்ய உதவும் ஆலோசனை மட்டுமே. கடன் முடிவு அல்ல.',
        allow: 'அனுமதி', skip: 'தவிர்', skipNote: 'தவிர்த்தாலும் எல்லா திட்டங்களையும் ஒப்பிடலாம்'
      }
    }[lang];
    const en = lang === 'en';
    return {
      t: S, isEn: en, isTa: !en,
      enBg: en ? '#002E6E' : 'transparent', enFg: en ? '#FFFFFF' : '#002E6E',
      taBg: !en ? '#002E6E' : 'transparent', taFg: !en ? '#FFFFFF' : '#002E6E',
      setEn: () => this.setState({ lang: 'en' }),
      setTa: () => this.setState({ lang: 'ta' })
    };
  }
}
</script>
</body>
</html>
