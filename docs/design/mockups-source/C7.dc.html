<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C7 Explanation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Tamil:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:360px;height:800px;display:flex;flex-direction:column;background:#EEF6FB;font-family:Inter,'Noto Sans Tamil',system-ui,sans-serif;color:#0B1F3A;overflow:hidden">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#FFFFFF;border-bottom:1px solid #DCE7F0;flex-shrink:0">
    <a href="C6.dc.html" aria-label="{{t.back}}" style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#002E6E"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="font-size:14px;color:#5B6B82;font-weight:600">{{t.step}}</div>
    <div role="group" aria-label="Language" style="display:flex;background:#EEF6FB;border-radius:999px;padding:3px">
      <button onClick="{{setEn}}" aria-pressed="{{isEn}}" style="min-width:48px;height:42px;border:0;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;background:{{enBg}};color:{{enFg}}">EN</button>
      <button onClick="{{setTa}}" aria-pressed="{{isTa}}" style="min-width:60px;height:42px;border:0;border-radius:999px;font-family:'Noto Sans Tamil',sans-serif;font-size:14px;font-weight:600;background:{{taBg}};color:{{taFg}}">தமிழ்</button>
    </div>
  </header>

  <main style="flex:1;min-height:0;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px">
    <h1 style="margin:0;font-size:22px;line-height:1.3;color:#002E6E">{{t.title}}</h1>

    <sc-if value="{{hasAi}}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="background:#FFFFFF;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:12px">
          <button onClick="{{toggleAudio}}" aria-label="{{audioLabel}}" style="width:52px;height:52px;border-radius:999px;border:0;background:#F5A524;color:#0B1F3A;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
            <sc-if value="{{paused}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg></sc-if>
          </button>
          <div style="flex:1;display:flex;flex-direction:column;gap:6px">
            <div style="font-size:15px;font-weight:600">{{audioLabel}}</div>
            <div style="height:6px;border-radius:999px;background:#EEF6FB"><div style="height:6px;border-radius:999px;background:#F5A524;width:{{progress}}"></div></div>
          </div>
          <div style="font-size:13px;color:#5B6B82;font-variant-numeric:tabular-nums">{{time}}</div>
        </div>

        <sc-for list="{{blocks}}" as="b" hint-placeholder-count="3">
          <div style="background:#FFFFFF;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;border:2px solid {{b.border}}">
            <p style="margin:0;font-size:16px;line-height:1.55">{{b.text}}</p>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <span style="display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:10px;background:#EEF6FB;color:#002E6E;font-size:15px;font-weight:700">{{b.n1}}</span>
              <span style="display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:10px;background:{{b.n2bg}};color:{{b.n2fg}};font-size:15px;font-weight:700">{{b.n2}}</span>
            </div>
          </div>
        </sc-for>
        <div style="font-size:14px;line-height:1.5;color:#5B6B82">{{t.aiNote}}</div>
      </div>
    </sc-if>

    <sc-if value="{{noAi}}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;gap:8px;align-items:center;font-size:15px;color:#5B6B82"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6"></path><path d="M12 7.5v.5"></path></svg>{{t.fallback}}</div>
        <div style="background:#FFFFFF;border-radius:16px;overflow:hidden">
          <div style="display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:6px;padding:10px 12px;background:#002E6E;color:#FFFFFF;font-size:13px;font-weight:600"><span>{{t.plan}}</span><span>{{t.monthly}}</span><span>{{t.extraS}}</span><span>{{t.total}}</span></div>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
            <div style="display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:6px;padding:12px;border-top:1px solid #DCE7F0;font-size:14px;align-items:center"><span style="font-weight:600">{{r.name}}</span><strong>{{r.m}}</strong><strong style="color:{{r.xfg}}">{{r.x}}</strong><span>{{r.tot}}</span></div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <a href="C8.dc.html" style="display:inline-flex;align-items:center;min-height:48px;font-size:16px;font-weight:600;color:#002E6E">{{t.teach}}</a>
  </main>

  <div style="padding:12px 16px 20px;background:#FFFFFF;border-top:1px solid #DCE7F0;flex-shrink:0">
    <a href="C9.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:14px;background:#00BAF2;color:#002E6E;font-weight:700;font-size:18px;text-decoration:none">{{t.cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","ta"],"default":"en"},"screenState":{"editor":"enum","options":["text","audio","unavailable"],"default":"text"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const lang = st.lang || this.props.lang || 'en';
    const s = this.props.screenState || 'text';
    const playing = st.playing !== undefined ? st.playing : s === 'audio';
    const en = lang === 'en';
    const S = {
      en: {
        back: 'Back', step: 'Step 4 of 4', title: 'Your plans in plain words',
        listen: 'Listen to this', pause: 'Playing. Tap to pause.',
        aiNote: 'Written by AI to explain the plans. It does not decide for you or approve anything.',
        fallback: 'Showing the standard plan details.',
        plan: 'Plan', monthly: 'Each month', extraS: 'Extra in total', total: 'You pay in all',
        teach: 'Check my understanding', cta: 'Continue to confirm',
        perMonth: (x) => x + ' a month', extra: (x) => x + ' extra in total',
        b: [
          'Card EMI is ₹3,850 a month for 6 months. You pay ₹1,100 extra in total.',
          'No-cost EMI is ₹3,667 a month for 6 months, with nothing extra. The brand pays the cost.',
          'Cardless credit is ₹2,050 a month for 12 months. You pay ₹2,600 extra in total. It is the only plan under your ₹3,000 budget.'
        ],
        names: ['Card EMI', 'No-cost EMI', 'Cardless']
      },
      ta: {
        back: 'பின்செல்', step: 'படி 4 / 4', title: 'உங்கள் திட்டங்கள், எளிய வார்த்தைகளில்',
        listen: 'கேளுங்கள்', pause: 'ஒலிக்கிறது. நிறுத்தத் தட்டவும்.',
        aiNote: 'திட்டங்களை விளக்க AI எழுதியது. இது உங்களுக்காக முடிவு எடுக்காது, எதையும் அங்கீகரிக்காது.',
        fallback: 'நிலையான திட்ட விவரங்கள் காட்டப்படுகின்றன.',
        plan: 'திட்டம்', monthly: 'மாதத்துக்கு', extraS: 'மொத்தக் கூடுதல்', total: 'மொத்தம்',
        teach: 'நான் புரிந்துகொண்டதைச் சரிபார்', cta: 'உறுதிசெய்யத் தொடர்க',
        perMonth: (x) => 'மாதம் ' + x, extra: (x) => 'மொத்தக் கூடுதல் ' + x,
        b: [
          'கார்டு EMI மாதம் ₹3,850, 6 மாதங்களுக்கு. மொத்தத்தில் ₹1,100 கூடுதலாகச் செலுத்துவீர்கள்.',
          'கட்டணமில்லா EMI மாதம் ₹3,667, 6 மாதங்களுக்கு. கூடுதலாக எதுவும் இல்லை. அந்தச் செலவை பிராண்ட் ஏற்கிறது.',
          'கார்டு இல்லா கடன் மாதம் ₹2,050, 12 மாதங்களுக்கு. மொத்தத்தில் ₹2,600 கூடுதல். உங்கள் ₹3,000 பட்ஜெட்டுக்குள் உள்ள ஒரே திட்டம் இது.'
        ],
        names: ['கார்டு EMI', 'கட்டணமில்லா', 'கார்டு இல்லா']
      }
    }[lang];
    const nums = [['₹3,850', '₹1,100', '₹23,100'], ['₹3,667', '₹0', '₹22,000'], ['₹2,050', '₹2,600', '₹24,600']];
    const blocks = nums.map((n, i) => ({
      text: S.b[i], n1: S.perMonth(n[0]), n2: S.extra(n[1]),
      n2bg: n[1] === '₹0' ? '#E3F7F0' : '#EEF6FB', n2fg: n[1] === '₹0' ? '#0A6E50' : '#002E6E',
      border: playing && i === 0 ? '#F5A524' : '#FFFFFF'
    }));
    const rows = nums.map((n, i) => ({ name: S.names[i], m: n[0], x: n[1], tot: n[2], xfg: n[1] === '₹0' ? '#0A6E50' : '#002E6E' }));
    return {
      t: S, isEn: en, isTa: !en, blocks, rows,
      hasAi: s !== 'unavailable', noAi: s === 'unavailable',
      playing, paused: !playing,
      audioLabel: playing ? S.pause : S.listen,
      progress: playing ? '38%' : '0%', time: playing ? '0:08 / 0:21' : '0:21',
      toggleAudio: () => this.setState({ playing: !playing }),
      enBg: en ? '#002E6E' : 'transparent', enFg: en ? '#FFFFFF' : '#002E6E',
      taBg: !en ? '#002E6E' : 'transparent', taFg: !en ? '#FFFFFF' : '#002E6E',
      setEn: () => this.setState({ lang: 'en' }),
      setTa: () => this.setState({ lang: 'ta' })
    };
  }
}
</script>
</body>
</html>
