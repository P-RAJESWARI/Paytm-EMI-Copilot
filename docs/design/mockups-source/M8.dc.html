<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M8 Weekly message on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Tamil:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:360px;height:800px;display:flex;flex-direction:column;background:#E9EEF3;font-family:Inter,'Noto Sans Tamil',system-ui,sans-serif;color:#0B1F3A;overflow:hidden">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#FFFFFF;border-bottom:1px solid #DCE7F0;flex-shrink:0">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="36" height="36" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="14" fill="#002E6E"></rect><path d="M7.5 19c1.8-6.5 11.2-6.5 13 0" stroke="#00BAF2" stroke-width="3" fill="none" stroke-linecap="round"></path><circle cx="14" cy="10.5" r="2.6" fill="#00BAF2"></circle></svg>
      <div><div style="font-weight:700;font-size:16px">EMI Copilot</div><div style="font-size:13px;color:#5B6B82">{{t.sub}}</div></div>
    </div>
    <div role="group" aria-label="Language" style="display:flex;background:#EEF6FB;border-radius:999px;padding:3px">
      <button onClick="{{setEn}}" aria-pressed="{{isEn}}" style="min-width:44px;height:42px;border:0;border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;background:{{enBg}};color:{{enFg}}">EN</button>
      <button onClick="{{setTa}}" aria-pressed="{{isTa}}" style="min-width:56px;height:42px;border:0;border-radius:999px;font-family:'Noto Sans Tamil',sans-serif;font-size:13px;font-weight:600;background:{{taBg}};color:{{taFg}}">தமிழ்</button>
    </div>
  </header>

  <main style="flex:1;min-height:0;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px">
    <div style="align-self:center;font-size:12px;color:#3D4B5F;background:#FFFFFF;border-radius:999px;padding:4px 10px">{{t.day}}</div>
    <div style="background:#FFFFFF;border-radius:4px 16px 16px 16px;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:300px">
      <div style="font-weight:700;font-size:15px">{{t.title}}</div>
      <p style="margin:0;font-size:15px;line-height:1.55">{{t.p1}}</p>
      <p style="margin:0;font-size:15px;line-height:1.55">{{t.p2}}</p>
      <p style="margin:0;font-size:15px;line-height:1.55;font-weight:600">{{t.p3}}</p>
      <div style="font-size:12px;color:#5B6B82;text-align:right">9:00 AM</div>
    </div>
    <div style="background:#FFFFFF;border-radius:4px 16px 16px 16px;padding:10px 12px;display:flex;align-items:center;gap:10px;max-width:300px">
      <button aria-label="{{t.listen}}" style="width:48px;height:48px;border-radius:999px;border:0;background:#F5A524;color:#0B1F3A;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg></button>
      <div style="flex:1;display:flex;flex-direction:column;gap:4px"><span style="font-size:14px;font-weight:600">{{t.listen}}</span><span style="font-size:12px;color:#5B6B82">0:34</span></div>
    </div>
    <a href="M5.dc.html" style="align-self:flex-start;display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:14px;background:#00BAF2;color:#002E6E;font-weight:700;font-size:15px;text-decoration:none">{{t.open}}</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","ta"],"default":"ta"},"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const lang = st.lang || this.props.lang || 'ta';
    const en = lang === 'en';
    const T = {
      en: {
        sub: 'Weekly message', day: 'Monday, 16 November',
        title: 'Your EMI sales, 9 to 15 November',
        p1: '44 of 120 customers bought on EMI. Most who left did so after seeing the plans.',
        p2: '12 customers wanted under ₹3,000 a month with nothing extra, and no plan fit. ₹1,84,000 is due from brands, first payment around 13 Jan.',
        p3: 'One thing to do: ask the brand for a 9 or 12-month no-cost plan on the 128 GB phone.',
        listen: 'Listen to this message', open: 'Open sales report'
      },
      ta: {
        sub: 'வாராந்திரச் செய்தி', day: 'திங்கள், 16 நவம்பர்',
        title: 'உங்கள் EMI விற்பனை, 9 முதல் 15 நவம்பர்',
        p1: '120 வாடிக்கையாளர்களில் 44 பேர் EMI-யில் வாங்கினர். விலகியவர்களில் பெரும்பாலோர் திட்டங்களைப் பார்த்த பின் விலகினர்.',
        p2: '12 பேர் கூடுதல் இல்லாமல் மாதம் ₹3,000-க்குள் விரும்பினர், எந்தத் திட்டமும் பொருந்தவில்லை. பிராண்டுகளிடமிருந்து ₹1,84,000 வர வேண்டும், முதல் தொகை சுமார் 13 ஜனவரி.',
        p3: 'செய்ய வேண்டியது: 128 GB போனுக்கு 9 அல்லது 12 மாத கட்டணமில்லா திட்டத்தை பிராண்டிடம் கேளுங்கள்.',
        listen: 'இந்தச் செய்தியைக் கேளுங்கள்', open: 'விற்பனை அறிக்கையைத் திற'
      }
    }[lang];
    return {
      t: T, isEn: en, isTa: !en,
      enBg: en ? '#002E6E' : 'transparent', enFg: en ? '#FFFFFF' : '#002E6E',
      taBg: !en ? '#002E6E' : 'transparent', taFg: !en ? '#FFFFFF' : '#002E6E',
      setEn: () => this.setState({ lang: 'en' }),
      setTa: () => this.setState({ lang: 'ta' })
    };
  }
}
</script>
</body>
</html>
